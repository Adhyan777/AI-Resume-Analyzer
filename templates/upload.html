{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">

    Upload Resume

</h2>

<form method="POST" enctype="multipart/form-data">

    <div class="mb-3">

        <label class="form-label">

            Select Resume (PDF)

        </label>

        <input
            type="file"
            name="resume"
            class="form-control"
            accept=".pdf"
        >

    </div>

    <button
        class="btn btn-primary">

        Upload

    </button>

</form>

{% endblock %}
